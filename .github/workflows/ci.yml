name: CI

on:
  pull_request:
  push:
    branches: [main]

# Um envio novo no mesmo branch cancela o CI do anterior. Na main isso evita que o CI de uma versão antiga termine
# depois do da nova e publique o site por cima dela.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run build

  # Job pesado (Docker + Supabase): só na main, não em cada PR.
  database:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0
      - run: npm run setup:local
      - run: npm run test:db
      - run: npm run test:concurrency
      - run: npm run db:types
      - run: git diff --exit-code -- src/lib/database.types.ts
